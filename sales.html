<!-- MAIN -->

<div class="main">

<!-- TOPBAR -->

<div class="topbar">

<h1>Sales Module</h1>

<div class="admin">

<i class="fa-solid fa-user"></i>
Admin

</div>

</div>

<!-- CARDS -->

<div class="cards">

<div class="card">

<i class="fa-solid fa-cart-shopping"></i>

<h2 id="salesCount">
0
</h2>

<p>Total Sales</p>

</div>

<div class="card">

<i class="fa-solid fa-peso-sign"></i>

<h2 id="salesAmount">
₱0
</h2>

<p>Total Revenue</p>

</div>

<div class="card">

<i class="fa-solid fa-fire"></i>

<h2>
Live
</h2>

<p>Sales Monitoring</p>

</div>

</div>

<!-- FORM -->

<div class="form-box">

<div class="form-title">

<i class="fa-solid fa-cash-register"></i>
Create Sale

</div>

<div class="form-grid">

<input
type="text"
id="saleReceipt"
placeholder="Receipt No">

<!-- DYNAMIC PRODUCT -->

<select id="saleProduct">

<option value="">
Select Product
</option>

</select>

<input
type="number"
id="saleQty"
placeholder="Quantity">

<input
type="number"
id="salePrice"
placeholder="Price">

<input
type="text"
id="saleCashier"
placeholder="Cashier Name">

<button
class="save-btn"
onclick="saveSale()">

<i class="fa-solid fa-floppy-disk"></i>
Save Sale

</button>

</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchSales"
placeholder="Search Sales..."
onkeyup="searchSales()">

</div>

<!-- TABLE -->

<div class="table-container">

<table>

<thead>

<tr>

<th>Receipt No</th>
<th>Product</th>
<th>Quantity</th>
<th>Price</th>
<th>Total</th>
<th>Cashier</th>
<th>Status</th>

</tr>

</thead>

<tbody id="salesTable">

</tbody>

</table>

</div>

</div>

<script src="js/app.js"></script>

<script>

// LOAD PRODUCT DROPDOWN

function loadSalesDropdown(){

let finished =
JSON.parse(localStorage.getItem("finishedProducts")) || [];

let dropdown =
document.getElementById("saleProduct");

if(!dropdown) return;

dropdown.innerHTML =
'<option value="">Select Product</option>';

finished.forEach(item=>{

dropdown.innerHTML += `

<option value="${item.name}">
${item.name}
</option>

`;

});

}

// SEARCH SALES

function searchSales(){

let input =
document
.getElementById("searchSales")
.value
.toLowerCase();

let rows =
document.querySelectorAll(
"#salesTable tr"
);

rows.forEach(row=>{

let text =
row.innerText.toLowerCase();

row.style.display =
text.includes(input)
? ""
: "none";

});

}

// LOAD SALES TOTAL

function loadSalesTotals(){

let sales =
JSON.parse(localStorage.getItem("sales")) || [];

let salesCount =
document.getElementById("salesCount");

let salesAmount =
document.getElementById("salesAmount");

if(salesCount){

salesCount.innerText =
sales.length;

}

let total = 0;

sales.forEach(item=>{

total += Number(item.total);

});

if(salesAmount){

salesAmount.innerText =
"₱" + total;

}

}

// AUTO LOAD

document.addEventListener(
"DOMContentLoaded",
()=>{

loadSalesDropdown();
loadSalesTotals();

}
);

</script>

</body>
