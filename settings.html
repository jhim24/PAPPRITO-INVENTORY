<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* BODY */

body{
background:#dfeef2;
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:linear-gradient(to bottom,#d40000,#900000);
color:white;
padding:20px;
position:fixed;
height:100%;
overflow:auto;
}

/* LOGO */

.logo{
text-align:center;
margin-bottom:40px;
}

.logo .icon{
width:80px;
height:80px;
background:white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
margin:auto;
margin-bottom:15px;
}

.logo .icon i{
font-size:35px;
color:#c40000;
}

.logo h1{
font-size:30px;
color:#ffd700;
}

.logo p{
font-size:14px;
color:#eee;
}

/* MENU */

.menu{
list-style:none;
}

.menu li{
margin-bottom:10px;
border-radius:12px;
overflow:hidden;
transition:0.3s;
}

.menu li a{
display:flex;
align-items:center;
gap:12px;
padding:15px;
text-decoration:none;
color:white;
font-size:15px;
}

.menu li:hover{
background:#ffd700;
}

.menu li:hover a{
color:black;
}

.active{
background:#ffd700;
}

.active a{
color:black !important;
}

/* MAIN */

.main{
margin-left:260px;
width:100%;
padding:25px;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.topbar h1{
font-size:32px;
color:#c40000;
}

.admin{
background:white;
padding:10px 18px;
border-radius:12px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* SETTINGS BOX */

.settings-box{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.settings-title{
font-size:24px;
font-weight:bold;
margin-bottom:20px;
color:#c40000;
display:flex;
align-items:center;
gap:10px;
}

/* GRID */

.settings-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

/* CARD */

.setting-card{
background:#f9f9f9;
padding:20px;
border-radius:15px;
border:1px solid #eee;
}

.setting-card h3{
margin-bottom:15px;
color:#c40000;
font-size:20px;
}

.setting-card label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#444;
}

.setting-card input,
.setting-card select{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
outline:none;
margin-bottom:15px;
font-size:14px;
}

/* BUTTON */

.save-btn{
background:linear-gradient(to right,#d40000,#900000);
color:white;
border:none;
padding:14px 20px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:bold;
transition:0.3s;
}

.save-btn:hover{
opacity:0.9;
transform:translateY(-2px);
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
width:85px;
}

.logo h1,
.logo p,
.menu li a span{
display:none;
}

.main{
margin-left:85px;
}

}

@media(max-width:600px){

.settings-grid{
grid-template-columns:1fr;
}

.topbar{
flex-direction:column;
align-items:flex-start;
}

}

</style>

</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

<div class="icon">

<i class="fa-solid fa-gear"></i>

</div>

<h1>PAPPRITO</h1>

<p>System Settings</p>

</div>

<ul class="menu">

<li>

<a href="dashboard.html">

<i class="fa-solid fa-chart-line"></i>
<span>Dashboard</span>

</a>

</li>

<li>

<a href="raw-materials.html">

<i class="fa-solid fa-drumstick-bite"></i>
<span>Raw Materials</span>

</a>

</li>

<li>

<a href="production.html">

<i class="fa-solid fa-gears"></i>
<span>Production</span>

</a>

</li>

<li>

<a href="finished-products.html">

<i class="fa-solid fa-burger"></i>
<span>Finished Products</span>

</a>

</li>

<li>

<a href="sales.html">

<i class="fa-solid fa-cash-register"></i>
<span>Sales</span>

</a>

</li>

<li>

<a href="reports.html">

<i class="fa-solid fa-file-lines"></i>
<span>Reports</span>

</a>

</li>

<li>

<a href="categories.html">

<i class="fa-solid fa-layer-group"></i>
<span>Categories</span>

</a>

</li>

<li class="active">

<a href="settings.html">

<i class="fa-solid fa-gear"></i>
<span>Settings</span>

</a>

</li>

</ul>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<h1>System Settings</h1>

<div class="admin">

<i class="fa-solid fa-user"></i>
Admin

</div>

</div>

<!-- SETTINGS -->

<div class="settings-box">

<div class="settings-title">

<i class="fa-solid fa-gear"></i>
System Configuration

</div>

<div class="settings-grid">

<!-- STORE SETTINGS -->

<div class="setting-card">

<h3>Store Information</h3>

<label>Store Name</label>

<input
type="text"
value="PAPPRITO">

<label>Branch</label>

<input
type="text"
placeholder="Enter Branch">

<label>Contact Number</label>

<input
type="text"
placeholder="Enter Contact Number">

<button class="save-btn">

Save Information

</button>

</div>

<!-- USER SETTINGS -->

<div class="setting-card">

<h3>User Account</h3>

<label>Username</label>

<input
type="text"
value="admin">

<label>Password</label>

<input
type="password"
value="123456">

<label>User Role</label>

<select>

<option>Administrator</option>
<option>Manager</option>
<option>Cashier</option>

</select>

<button class="save-btn">

Update Account

</button>

</div>

<!-- INVENTORY SETTINGS -->

<div class="setting-card">

<h3>Inventory Settings</h3>

<label>Low Stock Alert</label>

<input
type="number"
value="10">

<label>Default Unit</label>

<select>

<option>KG</option>
<option>PCS</option>
<option>Liters</option>

</select>

<label>Currency</label>

<select>

<option>PHP ₱</option>
<option>USD $</option>

</select>

<button class="save-btn">

Save Inventory Settings

</button>

</div>

<!-- BACKUP SETTINGS -->

<div class="setting-card">

<h3>Backup & Security</h3>

<label>Database Backup</label>

<input
type="text"
value="Last Backup: Today">

<label>System Status</label>

<input
type="text"
value="System Active">

<button class="save-btn">

Backup System

</button>

</div>

</div>

</div>

</div>

</body>
</html>
